# ─────────────────────────────────────────────────────────────────────────────
# BrowserGames100 — Nginx Production Config
# Optimized for: Core Web Vitals, Google AdSense, speed
# ─────────────────────────────────────────────────────────────────────────────

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name browsergames100.com www.browsergames100.com;
    return 301 https://browsergames100.com$request_uri;
}

# WWW → non-WWW redirect (canonical)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.browsergames100.com;

    ssl_certificate     /etc/letsencrypt/live/browsergames100.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/browsergames100.com/privkey.pem;

    return 301 https://browsergames100.com$request_uri;
}

# ─── Main HTTPS server ───────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name browsergames100.com;

    ssl_certificate     /etc/letsencrypt/live/browsergames100.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/browsergames100.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root  /var/www/browsergames100/dist;
    index index.html;

    # ─── Security Headers (required for AdSense) ─────────────────────────────
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "SAMEORIGIN"        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(), camera=(), microphone=()" always;

    # ─── Gzip Compression ────────────────────────────────────────────────────
    # Compresses JS/CSS/JSON by 60-80% — directly improves LCP/FCP scores
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # ─── IMAGE PROXY — WhatsApp/social OG thumbnails ─────────────────────────
    location /api/og/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   User-Agent $http_user_agent;
        proxy_cache_valid  200 1h;
    }

    # ─── GAME PAGES: Bot detection → OG proxy, users → React SPA ────────────
    location ~ ^/game/(.+)$ {
        set $game_slug $1;
        if ($http_user_agent ~* "(WhatsApp|facebookexternalhit|Facebot|Twitterbot|TelegramBot|LinkedInBot|Slackbot|Discordbot|Pinterest|Googlebot|bingbot|Applebot|redditbot|vkShare|iframely|Embedly|curl)") {
            proxy_pass http://127.0.0.1:5000/api/og/game/$game_slug;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header User-Agent $http_user_agent;
            break;
        }
        try_files $uri $uri/ /index.html;
    }

    # ─── API Proxy → Express backend ─────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # ─── Blog uploaded images ─────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    # ─── Game JSON data files — Stale-While-Revalidate (1 day) ──────────────
    # These are large JSON catalogs. 1d cache + revalidation = fast repeat visits
    location /data/ {
        expires            1d;
        add_header         Cache-Control "public, max-age=86400, stale-while-revalidate=3600";
        add_header         Vary "Accept-Encoding";
        try_files          $uri =404;
    }

    # ─── Vite Build Assets — Immutable (1 year) ──────────────────────────────
    # Hash in filename changes on every deploy = safe to cache forever
    location /assets/ {
        expires            1y;
        add_header         Cache-Control "public, max-age=31536000, immutable";
        add_header         Vary "Accept-Encoding";
        try_files          $uri =404;
    }

    # ─── PWA/Static files — Short cache ──────────────────────────────────────
    location ~* \.(ico|svg|png|webp|jpg|jpeg|gif|woff2|woff|ttf)$ {
        expires            30d;
        add_header         Cache-Control "public, max-age=2592000";
        try_files          $uri =404;
    }

    # ─── Sitemap & Robots ────────────────────────────────────────────────────
    location ~* \.(xml|txt)$ {
        expires            1d;
        add_header         Cache-Control "public, max-age=86400";
        try_files          $uri =404;
    }

    # ─── Service Worker — Never cache (must always be fresh) ─────────────────
    location = /sw.js {
        expires            -1;
        add_header         Cache-Control "no-cache, no-store, must-revalidate";
        try_files          $uri =404;
    }

    # ─── Manifest — Short cache ───────────────────────────────────────────────
    location = /manifest.json {
        expires            1d;
        add_header         Cache-Control "public, max-age=86400";
        try_files          $uri =404;
    }

    # ─── React SPA fallback ──────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        # HTML must not be cached — always serve fresh so new deploys take effect
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
